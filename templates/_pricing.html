<section class="wrap price-section" id="pricing"><span class="section-kicker">{{ t('prices.kicker') }}</span><div class="section-title"><h2>{{ t('prices.title') }}</h2><p>{{ t('prices.note') }}</p></div><div class="price-grid">{% for key,product in products.items() %}<article class="price-card"><span class="price-index">0{{ loop.index }}</span><h3>{{ t(product[0]) }}</h3><strong>{{ product[1] }} <small>₴</small></strong></article>{% endfor %}</div></section>
