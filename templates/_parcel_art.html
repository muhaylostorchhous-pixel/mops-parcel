<div class="delivery-art art-{{ art }}" aria-hidden="true"><svg class="parcel-illustration"><use href="{{ url_for('static',filename='parcel-art.svg') }}#{{ art }}"></use></svg><span class="art-caption">UK <span>→</span> UA</span></div>
