{% if user %}<div id="onboarding" hidden data-auto="{{ '1' if onboarding_auto else '0' }}" data-page="{{ request.endpoint }}"><div class="spotlight-ring" id="spotlightRing"></div><section class="onboarding-card" role="dialog" aria-modal="true" aria-labelledby="onboardingTitle"><button type="button" class="tour-close" id="onboardingClose" aria-label="{{ t('Закрыть') }}">×</button><span class="section-kicker">MOPS / <span id="onboardingCount"></span></span><h2 id="onboardingTitle">{{ t('tutorial.open') }}</h2><p id="onboardingText"></p><div class="tour-controls"><button type="button" class="button ghost" id="onboardingPrev">{{ t('Назад') }}</button><button type="button" class="button primary" id="onboardingNext">{{ t('Далее ↗') }}</button></div><button class="text-button" type="button" id="onboardingSkip">{{ t('tutorial.skip') }}</button></section></div>{% endif %}
