{% if open_invoices %}<aside class="invoice-stack wrap" aria-label="{{ t('payment.invoice') }}">{% for invoice in open_invoices %}<a class="invoice-banner" href="{{ url_for('pay_order',oid=invoice.id) }}"><span class="invoice-badge" aria-hidden="true">₴</span><span><small>{{ t('payment.pending') if invoice.payment_status=='pending' else t('payment.invoice') }}</small><strong>{{ invoice.item }}</strong></span><b>{{ t('payment.pending') if invoice.payment_status=='pending' else t('payment.pay') }} · {{ invoice.fee }} ₴ <span aria-hidden="true">↗</span></b></a>{% endfor %}</aside>{% endif %}
