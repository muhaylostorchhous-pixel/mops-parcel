{% extends 'base.html' %}
{% block content %}<section class="wrap dashboard"><div class="form-card verify-card"><span class="section-kicker">MOPS PARCEL</span><h1>{{ t('svc.verify') }}</h1><p>{{ t('svc.verify_hint') }}</p><p><b>{{ email }}</b></p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>{{ t('svc.code') }}<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required autofocus class="code-input"></label><button class="button primary full">{{ t('svc.confirm') }}</button></form><form method="post" action="/verify-email/resend"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="button ghost full">{{ t('svc.resend') }}</button></form></div></section>{% endblock %}
